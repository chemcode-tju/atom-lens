<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Structure Viewer</title>
<script>/*__THEME_JS__*/</script><style>/*__THEME_CSS__*/</style><style>/*__STYLE__*/</style><style>/*__SHELL_THEME__*/</style><style>/*__CHOICES_CSS__*/</style></head>
<body><!--__ICON_SPRITE__-->
<main>
  <header><h1 id="filename" data-empty-title>结构与轨迹</h1><div class="file-actions"><button id="open-path"><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>按路径打开</button><button id="open-file"><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>本地文件</button><input id="file-picker" type="file" multiple hidden></div>
    <details id="interface-settings"><summary title="界面设置" aria-label="界面设置"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></summary>
      <div class="settings-fields"><label>主题 <select id="theme-mode"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>界面字号 <select id="theme-size"><option value="14">14</option><option value="16">16</option><option value="18">18</option><option value="20">20</option></select></label>
    <label class="language-control" data-no-i18n>Language <select id="language" aria-label="Language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label></div>
    </details>
  </header>
  <details id="viewer-options"><summary>查看选项</summary>
    <div class="viewer-option-body">
      <div class="file-actions"><button id="display-settings"><svg class="icon" aria-hidden="true"><use href="#i-appearance"/></svg>显示设置</button><button id="drift-settings" disabled><svg class="icon" aria-hidden="true"><use href="#i-drift"/></svg>质心漂移校正</button><button id="snapshot"><svg class="icon" aria-hidden="true"><use href="#i-snapshot"/></svg>快照</button><button id="animation-export"><svg class="icon" aria-hidden="true"><use href="#i-timeline"/></svg>导出动画</button><button id="source-toggle"><svg class="icon" aria-hidden="true"><use href="#i-software"/></svg>源码</button></div>
      <div class="toolbar">
    <label>格式 <select id="import-format"><option value="auto">自动识别</option><option value="extxyz">XYZ / extxyz</option><option value="vasp">POSCAR / CONTCAR</option><option value="vasp-xdatcar">XDATCAR</option><option value="lammps-dump-text">LAMMPS dump（文本）</option><option value="lammps-data">LAMMPS data</option><option value="gromacs">GROMACS GRO</option><option value="proteindatabank">PDB</option><option value="cif">CIF</option></select></label>
    <select id="style" aria-label="显示方式"><option value="sphere">原子球</option><option value="ballstick">球棍</option><option value="stick">线棒</option></select>
    <select id="palette" aria-label="原子配色"><option value="jmol">Jmol</option><option value="rasmol">RasMol / CPK</option><option value="vesta">VESTA</option></select>
    <select id="radius-scale" aria-label="原子半径比例" title="原子半径比例"><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option></select>
    <label><input id="cell" type="checkbox" checked>晶胞</label><label><input id="labels" type="checkbox">序号</label><label><input id="hbonds" type="checkbox">氢键</label><label><input id="wrap" type="checkbox">Wrap</label>
  </div>
    </div>
  </details>
  <div id="status" role="alert" hidden></div>
  <div id="viewports" class="viewports" data-layout="single" data-mode="rotate"><button id="open-empty" type="button"><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>打开结构文件</button></div>

  <section id="source-panel" hidden><div class="section-head"><strong id="source-title">当前帧源码</strong></div><p id="import-note"></p><textarea id="source" readonly spellcheck="false" aria-label="当前结构源码"></textarea></section>
  <footer>
    <details id="trajectory-tools">
      <summary><svg class="icon" aria-hidden="true"><use href="#i-timeline"/></svg><span>轨迹与视图</span><span id="selected-summary" hidden></span><span id="frame-summary" data-no-i18n></span><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></summary>
      <div class="trajectory-body">
        <div class="timeline-row">
          <div class="frame-label"><input id="frame-number" type="number" min="1" value="1" aria-label="帧号"><span id="frame-count"><span aria-hidden="true">/</span><span id="frame-total">—</span></span></div>
          <div class="ruler"><div id="ticks" aria-hidden="true"></div><input id="timeline" type="range" min="0" max="0" value="0" aria-label="轨迹帧滑块" disabled></div>
        </div>
        <div class="control-row">
          <div class="playback" role="group" aria-label="轨迹播放"><button type="button" id="first" aria-label="第一帧" title="第一帧"><svg class="icon" aria-hidden="true"><use href="#i-first"/></svg></button>
          <button type="button" id="previous" aria-label="上一帧" title="上一帧"><svg class="icon" aria-hidden="true"><use href="#i-previous"/></svg></button>
          <button type="button" id="play" aria-label="播放轨迹" title="播放轨迹"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg></button>
          <button type="button" id="next" aria-label="下一帧" title="下一帧"><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
          <button type="button" id="last" aria-label="最后一帧" title="最后一帧"><svg class="icon" aria-hidden="true"><use href="#i-last"/></svg></button>
          <button type="button" id="playback-settings" aria-label="播放设置" title="播放设置"><svg class="icon" aria-hidden="true"><use href="#i-speed"/></svg></button></div>
          <div class="view-controls"><select id="orientation" aria-label="视图方向"><option value="xz">Front · XZ</option><option value="xy">Top · XY</option><option value="yz">Left · YZ</option><option value="perspective">Perspective</option></select><select id="layout" aria-label="视图布局"><option value="single">单视图</option><option value="dual">双视图</option><option value="quad">四视图</option></select></div>
          <div class="navigation" role="group" aria-label="视图操作"><button type="button" id="rotate" data-mode-button="rotate" aria-pressed="true" aria-label="旋转" title="旋转"><svg class="icon" aria-hidden="true"><use href="#i-rotate"/></svg></button>
          <button type="button" id="pan" data-mode-button="pan" aria-pressed="false" aria-label="平移" title="平移"><svg class="icon" aria-hidden="true"><use href="#i-pan"/></svg></button>
          <button type="button" id="zoom" data-mode-button="zoom" aria-pressed="false" aria-label="缩放" title="缩放"><svg class="icon" aria-hidden="true"><use href="#i-zoom"/></svg></button>
          <button type="button" id="select" data-mode-button="select" aria-pressed="false" aria-label="选择原子" title="选择原子"><svg class="icon" aria-hidden="true"><use href="#i-cursor"/></svg></button>
          <button type="button" id="box" data-mode-button="box" aria-pressed="false" aria-label="框选原子" title="框选原子"><svg class="icon" aria-hidden="true"><use href="#i-box"/></svg></button>
          <button type="button" id="reset" aria-label="适应视图" title="适应视图"><svg class="icon" aria-hidden="true"><use href="#i-fit"/></svg></button>
          <button type="button" id="expand" aria-label="展开 / 恢复多视图" title="展开 / 恢复多视图"><svg class="icon" aria-hidden="true"><use href="#i-expand"/></svg></button></div>
        </div>
        <section id="atom-panel" hidden><strong id="atom-title"></strong><output id="measurement"></output><span id="atom-list"></span><button id="clear-selection" disabled>清除选择</button></section>
      </div>
    </details>
  </footer>
</main>
<dialog id="drift-dialog" class="floating-panel"><h2>质心漂移校正</h2><fieldset>
<label class="check-row"><input id="drift-enabled" type="checkbox">移除轨迹的质心漂移</label>
<label>参考帧编号（从 0 开始）<input id="drift-reference" type="number" min="0" value="0"></label>
<label>计算范围<select id="drift-source"><option value="all">全部原子</option><option value="indices">指定原子</option></select></label>
<label>原子序号（从 1 开始）<input id="drift-atoms" placeholder="1, 3, 5-12"></label>
<button id="drift-use-selection">填入当前选择</button><output id="drift-state">未启用</output>
</fieldset>
<output id="drift-error" role="alert"></output><div class="dialog-actions"><button id="drift-close">关闭</button><button id="drift-apply">应用</button></div></dialog>

<dialog id="display-dialog" class="floating-panel">
  <h2>显示设置</h2>
  <fieldset><legend>元素显隐</legend><div id="element-list"></div><button id="show-elements">全部显示</button></fieldset>
  <fieldset><legend id="selection-count">选中原子</legend>
    <label>显示方式 <select id="selection-style"><option value="">跟随全局</option><option value="mixed" hidden disabled>多种值</option><option value="sphere">原子球</option><option value="ballstick">球棍</option><option value="stick">线棒</option></select></label>
    <label>配色 <select id="selection-palette"><option value="">跟随全局</option><option value="mixed" hidden disabled>多种值</option><option value="jmol">Jmol</option><option value="rasmol">RasMol / CPK</option><option value="vesta">VESTA</option></select></label>
    <label>显隐 <select id="selection-visible"><option value="">跟随全局</option><option value="mixed" hidden disabled>多种值</option><option value="show">显示</option><option value="hide">隐藏</option></select></label>
    <button id="reset-selected-style">恢复选中原子默认</button>
  </fieldset>
  <div class="dialog-actions"><button id="reset-display">恢复所有显示设置</button><button id="display-close">关闭</button></div>
</dialog>
<dialog id="playback-dialog">
  <form method="dialog"><h2>播放设置</h2>
  <fieldset><legend>动画</legend><label>每秒帧数 <input id="animation-fps" type="number" min="1" max="120" value="60"></label></fieldset>
  <fieldset><legend>视窗内播放</legend>
  <label>播放速度 <select id="playback-speed"><option value="0.25">× 0.25</option><option value="0.5">× 0.5</option><option value="1" selected>× 1</option><option value="2">× 2</option><option value="5">× 5</option><option value="10">× 10</option><option value="20">× 20</option></select></label>
  <label>每隔 N 帧播放 <input id="playback-step" type="number" min="1" max="10000" value="1"></label>
  <label class="check-row"><input id="playback-loop" type="checkbox" checked>循环播放</label></fieldset>
  <div class="dialog-actions"><button value="cancel">取消</button><button id="playback-apply" value="default">确定</button></div></form>
</dialog>
<dialog id="path-dialog"><h2>打开结构文件</h2><label for="structure-path" id="path-host">当前主机上的完整路径</label><input id="structure-path" type="text" placeholder="/完整路径/POSCAR" autocomplete="off" spellcheck="false"><label for="companion-paths">LAMMPS 配套路径（每行一个，可留空）</label><textarea id="companion-paths" rows="2"></textarea><output id="path-error" role="alert"></output><div class="dialog-actions"><button id="path-close">关闭</button><button id="path-load">打开</button></div></dialog>
<dialog id="snapshot-dialog">
  <h2>保存快照</h2>
  <div class="snapshot-preview"><img id="snapshot-preview" alt="当前构型快照" hidden></div>
  <div class="export-fields"><label>文件名 <input id="snapshot-name" value="structure" maxlength="80"></label><label>格式 <select id="snapshot-format"><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="pdf">PDF</option></select></label>
  <label>DPI <select id="snapshot-dpi"><option value="96">96</option><option value="150">150</option><option value="300" selected>300</option><option value="600">600</option></select></label>
  <label class="check-row"><input id="snapshot-transparent" type="checkbox" checked>透明背景（PNG）</label><label class="check-row"><input id="snapshot-crop" type="checkbox">裁去四周空白</label></div>
  <div class="export-fields"><label>保存到 <select id="snapshot-destination"><option value="local">本地 Mac</option><option value="server">服务器</option></select></label>
  <label id="snapshot-directory-row" hidden>目录 <input id="snapshot-directory" placeholder="结构所在目录"></label></div>
  <output id="snapshot-result"></output><div class="dialog-actions"><button id="snapshot-close">关闭</button><button id="snapshot-save">保存</button></div>
</dialog>
<dialog id="animation-dialog"><h2>导出动画</h2>
<fieldset id="animation-fields"><label>文件名<input id="animation-name" value="trajectory" maxlength="80"></label>
<label>格式<select id="animation-format"><option value="mp4">MP4</option><option value="mov">MOV</option><option value="gif">GIF</option></select></label>
<label>起始帧（从 1 开始）<input id="animation-start" type="number" min="1" value="1"></label>
<label>结束帧<input id="animation-end" type="number" min="1" value="1"></label>
<label>每隔 N 帧导出<input id="animation-stride" type="number" min="1" value="1"></label>
<label>基础帧率<input id="animation-rate" type="number" min="1" value="30"></label>
<label>播放速度<select id="animation-speed"><option value="0.25">× 0.25</option><option value="0.5">× 0.5</option><option value="1" selected>× 1</option><option value="2">× 2</option><option value="5">× 5</option><option value="10">× 10</option></select></label>
<label>保存到<select id="animation-destination"><option value="local">本地 Mac</option><option value="server">服务器</option></select></label>
<label id="animation-directory-row">目录<input id="animation-directory" placeholder="结构所在目录"></label></fieldset>
<output id="animation-result"></output><div class="dialog-actions"><button id="animation-close">关闭</button><button id="animation-save">导出并保存</button></div></dialog>
<script>/*__I18N__*/</script><script>/*__3DMOL__*/</script><script>/*__PARSER__*/</script><script>/*__APPEARANCE__*/</script><script>/*__GEOMETRY__*/</script><script>/*__ASE_TRAJ__*/
/*__VASP_STREAM__*/</script><script>/*__TRAJECTORY_STORE__*/</script><script>/*__SNAPSHOT__*/</script><script>/*__SELECTION__*/</script><script>/*__SCENE__*/</script><script>/*__VIEWPORT__*/</script><script>/*__CONTROLS__*/</script><script>/*__LAMMPS__*/</script><script>/*__MD__*/</script><script>/*__IMPORT__*/</script><script>/*__HOST_FILES__*/</script><script>/*__APP__*/</script><script>/*__ANIMATION__*/</script>
<script type="module">/*__CHOICES_JS__*/</script></body></html>
