<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Structure Viewer</title><style>/*__STYLE__*/</style></head>
<body>
<main>
  <header><h1 id="filename">Structure Viewer</h1><div class="file-actions"><button id="open-file">打开</button><input id="file-picker" type="file" hidden><button id="snapshot">快照</button><button id="enable-edit" hidden>启用编辑</button><button id="source-toggle">源码</button><button id="save" disabled>保存</button></div></header>
  <div class="toolbar">
    <select id="style" aria-label="显示方式"><option value="sphere">原子球</option><option value="ballstick">球棍</option><option value="stick">线棒</option></select>
    <select id="palette" aria-label="原子配色"><option value="jmol">Jmol</option><option value="rasmol">RasMol / CPK</option><option value="vesta">VESTA</option></select>
    <select id="radius-scale" aria-label="原子半径比例" title="原子半径比例"><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option></select>
    <label><input id="cell" type="checkbox" checked>晶胞</label><label><input id="labels" type="checkbox">序号</label><label><input id="hbonds" type="checkbox">氢键</label><label><input id="wrap" type="checkbox">Wrap</label>
  </div>
  <div id="status" role="alert" hidden></div>
  <div id="viewports" class="viewports" data-layout="single" data-mode="rotate"></div>
  <section id="atom-panel" hidden><div class="section-head"><strong id="atom-title">原子</strong><span id="distance"></span></div><div class="coordinates"><label>X <input id="coord-x" type="number" step="0.01"></label><label>Y <input id="coord-y" type="number" step="0.01"></label><label>Z <input id="coord-z" type="number" step="0.01"></label><button id="follow-selected">跟随此原子</button><button id="apply-atom">应用</button></div></section>
  <section id="source-panel" hidden><div class="section-head"><strong id="source-title">当前帧源码</strong><button id="apply-source">应用源码</button></div><textarea id="source" spellcheck="false" aria-label="当前结构源码"></textarea></section>
  <footer>
    <div class="timeline-row"><div class="frame-label"><input id="frame-number" type="number" min="1" value="1" aria-label="帧号"><span id="frame-count">/ —</span></div><div class="ruler"><div id="ticks" aria-hidden="true"></div><input id="timeline" type="range" min="0" max="0" value="0" aria-label="轨迹帧滑块" disabled></div></div>
    <div class="control-row">
      <div class="playback"><button id="first" aria-label="第一帧" title="第一帧">|◀</button><button id="previous" aria-label="上一帧" title="上一帧">◀</button><button id="play" aria-label="播放轨迹" title="播放 / 暂停">▶</button><button id="next" aria-label="下一帧" title="下一帧">▶</button><button id="last" aria-label="最后一帧" title="最后一帧">▶|</button><button id="playback-settings" aria-label="播放设置" title="播放设置">⚙</button></div>
      <div class="view-controls"><details id="orientation" class="view-menu"><summary id="orientation-label">Front · XZ</summary><div class="view-menu-items"><button data-orientation="xz">Front · XZ</button><button data-orientation="xy">Top · XY</button><button data-orientation="yz">Left · YZ</button><button data-orientation="perspective">Perspective</button></div></details><select id="layout" aria-label="视图布局"><option value="single">单视图</option><option value="dual">双视图</option><option value="quad">四视图</option></select></div>
      <div class="navigation" role="group" aria-label="视图操作"><button id="rotate" data-mode-button="rotate" aria-label="旋转" title="旋转" aria-pressed="true">⟳</button><button id="pan" data-mode-button="pan" aria-label="平移" title="平移" aria-pressed="false">✥</button><button id="zoom" data-mode-button="zoom" aria-label="缩放" title="缩放" aria-pressed="false">⌕</button><button id="reset" aria-label="适应视图" title="适应视图">⊡</button><button id="expand" aria-label="展开当前视图" title="展开 / 恢复多视图">⛶</button></div>
    </div>
    <div class="follow-row"><label><input id="follow" type="checkbox">跟随原子</label><input id="follow-number" type="number" min="1" value="1" aria-label="跟随原子序号"><button id="follow-apply">指定中心</button></div>
  </footer>
</main>
<dialog id="playback-dialog">
  <form method="dialog"><h2>播放设置</h2>
  <fieldset><legend>Animation</legend><label>Frames per second <input id="animation-fps" type="number" min="1" max="120" value="60"></label></fieldset>
  <fieldset><legend>Playback in interactive viewports</legend>
  <label>Playback speed <select id="playback-speed"><option value="0.25">× 0.25</option><option value="0.5">× 0.5</option><option value="1" selected>× 1</option><option value="2">× 2</option><option value="5">× 5</option><option value="10">× 10</option><option value="20">× 20</option></select></label>
  <label>Every Nth frame <input id="playback-step" type="number" min="1" max="10000" value="1"></label>
  <label class="check-row"><input id="playback-loop" type="checkbox" checked>Loop playback</label></fieldset>
  <div class="dialog-actions"><button value="cancel">取消</button><button id="playback-apply" value="default">确定</button></div></form>
</dialog>
<dialog id="snapshot-dialog">
  <h2>保存快照</h2>
  <div class="snapshot-preview"><img id="snapshot-preview" alt="当前构型快照" hidden></div>
  <div class="export-fields"><label>文件名 <input id="snapshot-name" value="structure" maxlength="80"></label><label>格式 <select id="snapshot-format"><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="pdf">PDF</option></select></label>
  <label>DPI <select id="snapshot-dpi"><option value="96">96</option><option value="150">150</option><option value="300" selected>300</option><option value="600">600</option></select></label>
  <label class="check-row"><input id="snapshot-transparent" type="checkbox" checked>透明背景（PNG）</label><label class="check-row"><input id="snapshot-crop" type="checkbox">裁去四周空白</label></div>
  <output id="snapshot-result"></output><div class="dialog-actions"><button id="snapshot-close">关闭</button><button id="snapshot-save">保存</button></div>
</dialog>
<script>/*__3DMOL__*/</script><script>/*__PARSER__*/</script><script>/*__APPEARANCE__*/</script><script>/*__GEOMETRY__*/</script><script>/*__ASE_TRAJ__*/</script><script>/*__SNAPSHOT__*/</script><script>/*__VIEWPORT__*/</script><script>/*__APP__*/</script>
</body></html>
